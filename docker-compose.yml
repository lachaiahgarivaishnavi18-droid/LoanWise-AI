services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loanwise
      POSTGRES_USER: loanwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanwise"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: loanwise
      POSTGRES_DB: loanwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      MODEL_DIR: runtime/models
      OCR_ENABLED: ${OCR_ENABLED:-true}
    volumes:
      - backend_runtime:/app/runtime
      - synthetic_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      retries: 10
volumes:
  postgres_data:
  backend_runtime:
  synthetic_data:
